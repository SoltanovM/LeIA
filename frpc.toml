# frpc.toml - túnel reverso SÓ do LeIA. Mesmo padrão dos outros apps de lab.soltanov.io.
# NADA de confidencial aqui: todos os valores sensíveis vêm do ./.env via templating
# ({{ .Envs.X }}), que o frpc resolve antes de parsear o TOML. Assim este arquivo pode ir
# pro git sem vazar endereço/porta/token do relay.
serverAddr = "{{ .Envs.FRP_SERVER_ADDR }}"    # relay (IP/host) - .env: FRP_SERVER_ADDR
serverPort = {{ .Envs.FRP_SERVER_PORT }}      # frps: canal de controle - .env: FRP_SERVER_PORT
auth.method = "token"
auth.token = "{{ .Envs.FRP_TOKEN }}"

# Folga de heartbeat: sob carga pesada (extração de doc grande em paralelo) a máquina fica
# saturada e o frpc pode não mandar o heartbeat a tempo. Com o timeout padrão (90s) o túnel
# cairia ("i/o deadline reached" → 502). Subimos pra 180s pra aguentar o pico sem dropar.
transport.heartbeatInterval = 30
transport.heartbeatTimeout = 180
# dialServerTimeout: tempo pra completar o dial+login no relay. Subimos p/ 30s porque, num
# uplink de casa saturado/lossy, a RECONEXÃO estourava o padrão ("i/o deadline reached").
transport.dialServerTimeout = 30

# name e remotePort precisam ser ÚNICOS no relay. Caddy: LeIA.lab.soltanov.io → 127.0.0.1:<remotePort>.
[[proxies]]
name = "leia"
type = "tcp"
localIP = "leia"                          # nome do container leia neste compose
localPort = {{ .Envs.LEIA_PORT }}         # porta interna do Streamlit
remotePort = {{ .Envs.FRP_REMOTE_PORT }}  # porta que o frps abre no relay - .env: FRP_REMOTE_PORT

# Painel do Langfuse (observabilidade). Caddy: obs.leia.lab.soltanov.io → 127.0.0.1:<remotePort>.
# Só serve se o stack langfuse estiver no ar (`make up-obs`); senão o frpc só loga "conn refused"
# neste proxy e segue servindo o do leia normalmente.
[[proxies]]
name = "leia-obs"
type = "tcp"
localIP = "langfuse-web"                      # nome do serviço langfuse-web neste compose
localPort = 3000                              # porta interna fixa do Langfuse (imagem oficial)
remotePort = {{ .Envs.FRP_OBS_REMOTE_PORT }}  # porta que o frps abre no relay - .env: FRP_OBS_REMOTE_PORT
